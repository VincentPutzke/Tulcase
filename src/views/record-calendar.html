<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta
  http-equiv="Content-Security-Policy"
  content="default-src 'none';
           script-src 'nonce-{{NONCE}}';
           style-src  'unsafe-inline';"
>
<style>{{STYLE}}</style>
</head>
<body>

<div class="layout">

<!-- ── Add bar ───────────────────────────────────────────────
     Narrow (sidebar): sits above the calendar, full width.
     Wide (panel):     moves to the top of the detail column
     (right side), above the entries list.                  -->
<div class="add-bar">
  <button class="add-btn" id="btn-add">+ Log Time</button>
  <button class="add-btn add-btn-secondary" id="btn-add-other">+ Another Day</button>
</div>

<!-- ── Calendar pane ──────────────────────────────────────── -->
<div class="cal-pane">

  <!-- Month navigation -->
  <div class="month-nav">
    <button class="nav-btn" id="prev">&#8249;</button>
    <div class="month-label" id="month-label"></div>
    <button class="nav-btn" id="next">&#8250;</button>
  </div>

  <!-- Calendar wrapper (day-headers + grid) -->
  <div class="cal-wrapper">
    <div class="day-headers" id="day-headers"></div>
    <div class="calendar" id="calendar"></div>
  </div>

  <!-- Month summary stats -->
  <div class="month-summary" id="month-summary"></div>

</div>

<!-- ── Entries pane ────────────────────────────────────────── -->
<div class="entries-pane" id="entries-section"></div>

</div><!-- /.layout -->

<script nonce="{{NONCE}}">
(function () {
  'use strict';

  const vscode = acquireVsCodeApi();

  // ── Constants ───────────────────────────────────────────
  const MONTH_NAMES = [
    'January','February','March','April','May','June',
    'July','August','September','October','November','December',
  ];
  const DAY_ABBR = ['Mo','Tu','We','Th','Fr','Sa','Su'];

  // ── State ───────────────────────────────────────────────
  let year      = new Date().getFullYear();
  let month     = new Date().getMonth() + 1;
  let monthData = null;   // RecordDb | null
  let selected  = null;   // 'YYYY-MM-DD' | null
  var savedState = vscode.getState() || {};
  let entriesCollapsed = savedState.entriesCollapsed !== undefined ? savedState.entriesCollapsed : false;

  function saveState() {
    vscode.setState({ entriesCollapsed: entriesCollapsed });
  }

  // ── Utility ─────────────────────────────────────────────

  function fmt(min) {
    var h = Math.floor(min / 60);
    var m = min % 60;
    return h + ':' + String(m).padStart(2, '0');
  }

  function esc(s) {
    return String(s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function todayISO() {
    var d = new Date();
    return d.getFullYear()
      + '-' + String(d.getMonth() + 1).padStart(2, '0')
      + '-' + String(d.getDate()).padStart(2, '0');
  }

  function dayTotalMin(dateStr) {
    var entries = monthData && monthData.days ? monthData.days[dateStr] : null;
    if (!entries) { return 0; }
    var sum = 0;
    for (var i = 0; i < entries.length; i++) { sum += entries[i].time_spent_min; }
    return sum;
  }

  function dayHasEntries(dateStr) {
    var entries = monthData && monthData.days ? monthData.days[dateStr] : null;
    return !!entries && entries.length > 0;
  }

  // ── SVG icons ───────────────────────────────────────────

  var ICONS = {
    edit: '<svg class="icon" width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M20.71 7.04a1 1 0 0 0 0-1.41l-2.34-2.34a1 1 0 0 0-1.42 0l-1.83 1.83 3.75 3.75 1.84-1.83z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    delete: '<svg class="icon" width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M3 6h18" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M10 11v6M14 11v6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    clock: '<svg class="icon" width="14" height="14" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="1.5"/><path d="M12 6v6l4 2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    emptyCalendar: '<svg class="icon" width="28" height="28" viewBox="0 0 24 24" fill="none"><rect x="3" y="4" width="18" height="18" rx="2" stroke="currentColor" stroke-width="1.5"/><path d="M16 2v4M8 2v4M3 10h18" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  };

  // ── Rendering ───────────────────────────────────────────

  function render() {
    renderCalendar();
    renderSummary();
    renderEntries();
  }

  /** Render the static Mon-Sun header strip. */
  function renderHeaders() {
    var hdrEl = document.getElementById('day-headers');
    var html = '';
    for (var i = 0; i < DAY_ABBR.length; i++) {
      html += '<div class="day-hdr">' + DAY_ABBR[i] + '</div>';
    }
    hdrEl.innerHTML = html;
  }

  /** Render the month label + calendar grid. */
  function renderCalendar() {
    document.getElementById('month-label').textContent =
      MONTH_NAMES[month - 1] + ' ' + year;

    var cal = document.getElementById('calendar');
    var firstDow    = new Date(year, month - 1, 1).getDay(); // 0 = Sun
    var startOffset = (firstDow + 6) % 7;                    // shift to Mon-first
    var daysInMonth = new Date(year, month, 0).getDate();
    var today       = todayISO();

    var html = '';

    // Leading empty cells
    for (var i = 0; i < startOffset; i++) {
      html += '<div class="day empty"></div>';
    }

    // Day cells
    for (var d = 1; d <= daysInMonth; d++) {
      var iso = year
        + '-' + String(month).padStart(2, '0')
        + '-' + String(d).padStart(2, '0');
      var hasEntry = dayHasEntries(iso);
      var min      = dayTotalMin(iso);

      var cls = 'day';
      if (hasEntry)       { cls += ' has-entry'; }
      if (iso === today)  { cls += ' today'; }
      if (iso === selected) { cls += ' selected'; }

      html += '<div class="' + cls + '" data-date="' + iso + '">'
        + '<div class="day-num">' + d + '</div>'
        + (min > 0 ? '<div class="day-hours">' + fmt(min) + '</div>' : '')
        + '</div>';
    }

    // Trailing empty cells to fill the last row
    var totalCells = startOffset + daysInMonth;
    var remainder  = totalCells % 7;
    var trailing   = remainder === 0 ? 0 : 7 - remainder;
    for (var t = 0; t < trailing; t++) {
      html += '<div class="day empty"></div>';
    }

    cal.innerHTML = html;

    // Attach click / double-click handlers on day cells
    cal.querySelectorAll('.day:not(.empty)').forEach(function (cell) {
      cell.addEventListener('click', function () {
        selected = cell.getAttribute('data-date');
        render();
      });
      cell.addEventListener('dblclick', function () {
        vscode.postMessage({
          type: 'addToDate',
          dateStr: cell.getAttribute('data-date'),
        });
      });
    });
  }

  /** Render the month summary stats bar. */
  function renderSummary() {
    var totalMin   = 0;
    var workedDays = 0;
    if (monthData && monthData.days) {
      var keys = Object.keys(monthData.days);
      for (var k = 0; k < keys.length; k++) {
        var entries = monthData.days[keys[k]];
        var d = 0;
        for (var j = 0; j < entries.length; j++) { d += entries[j].time_spent_min; }
        if (d > 0) { totalMin += d; workedDays++; }
      }
    }
    var avg = workedDays > 0 ? Math.round(totalMin / workedDays) : 0;

    document.getElementById('month-summary').innerHTML =
      '<span>Total <strong>' + fmt(totalMin) + '</strong></span>'
      + '<span class="summary-sep">·</span>'
      + '<span>Avg <strong>' + fmt(avg) + '</strong>/day</span>'
      + '<span class="summary-sep">·</span>'
      + '<span><strong>' + workedDays + '</strong> days</span>';
  }

  /** Render the selected-day entries as a section with tree-items. */
  function renderEntries() {
    var container = document.getElementById('entries-section');

    if (!selected) {
      container.innerHTML = '<div class="empty-state">'
        + '<div class="empty-state-icon">' + ICONS.emptyCalendar + '</div>'
        + 'Select a day to view entries.'
        + '</div>';
      return;
    }

    var entries = monthData && monthData.days ? (monthData.days[selected] || []) : [];
    var parts   = selected.split('-');
    var dayLabel = parseInt(parts[2], 10)
      + ' ' + MONTH_NAMES[parseInt(parts[1], 10) - 1]
      + ' ' + parts[0];

    var bodyStyle = entriesCollapsed ? 'max-height:0;' : '';

    var html = '<div class="section">'
      + '<div class="section-header" id="entries-toggle">'
      + '  <span class="section-chevron' + (entriesCollapsed ? ' collapsed' : '') + '">▾</span>'
      + '  <span class="section-icon">' + ICONS.clock + '</span>'
      + '  <span class="section-label">' + esc(dayLabel) + '</span>'
      + '  <span class="section-badge">' + entries.length + '</span>'
      + '</div>'
      + '<div class="section-body" style="' + bodyStyle + '">';

    if (entries.length === 0) {
      html += '<div class="empty-state">No entries — double-click a day to add one.</div>';
    } else {
      for (var i = 0; i < entries.length; i++) {
        var entry = entries[i];
        html += '<div class="tree-item">'
          + '<div class="tree-item-row">'
          + '  <span class="tree-item-icon">' + ICONS.clock + '</span>'
          + '  <div class="tree-item-content">'
          + '    <span class="tree-item-label">' + esc(fmt(entry.time_spent_min)) + '</span>'
          + '    <span class="tree-item-meta">' + esc(entry.notes || '(no notes)') + '</span>'
          + '  </div>'
          + '  <div class="tree-item-actions">'
          + '    <button class="action-btn btn-edit" title="Edit" data-action="editEntry" data-date="' + esc(selected) + '" data-index="' + i + '">' + ICONS.edit + '</button>'
          + '    <button class="action-btn btn-delete" title="Delete" data-action="deleteEntry" data-date="' + esc(selected) + '" data-index="' + i + '">' + ICONS.delete + '</button>'
          + '  </div>'
          + '</div>'
          + '</div>';
      }
    }

    html += '</div></div>';
    container.innerHTML = html;

    // Toggle handler for the section header
    var toggle = document.getElementById('entries-toggle');
    if (toggle) {
      toggle.addEventListener('click', function () {
        entriesCollapsed = !entriesCollapsed;
        saveState();
        renderEntries();
      });
    }

    // Action button handlers
    container.querySelectorAll('[data-action]').forEach(function (btn) {
      btn.addEventListener('click', function (e) {
        e.stopPropagation();
        vscode.postMessage({
          type:    btn.getAttribute('data-action'),
          dateStr: btn.getAttribute('data-date'),
          index:   parseInt(btn.getAttribute('data-index'), 10),
        });
      });
    });
  }

  // ── Navigation ──────────────────────────────────────────

  document.getElementById('prev').addEventListener('click', function () {
    month--;
    if (month < 1) { month = 12; year--; }
    selected = null;
    vscode.postMessage({ type: 'loadMonth', year: year, month: month });
  });

  document.getElementById('next').addEventListener('click', function () {
    month++;
    if (month > 12) { month = 1; year++; }
    selected = null;
    vscode.postMessage({ type: 'loadMonth', year: year, month: month });
  });

  // ── Add buttons ─────────────────────────────────────────

  document.getElementById('btn-add').addEventListener('click', function () {
    vscode.postMessage({ type: 'addToday' });
  });

  document.getElementById('btn-add-other').addEventListener('click', function () {
    vscode.postMessage({ type: 'addAnotherDay' });
  });

  // ── Message bus ─────────────────────────────────────────

  window.addEventListener('message', function (event) {
    var msg = event.data;
    if (msg.type === 'updateData') {
      year      = msg.year;
      month     = msg.month;
      monthData = msg.data;

      // Auto-select today if no selection and today falls in this month
      if (!selected) {
        var today = todayISO();
        if (today.startsWith(year + '-' + String(month).padStart(2, '0'))) {
          selected = today;
        }
      }

      render();
    }
  });

  // ── Bootstrap ───────────────────────────────────────────

  renderHeaders();
  vscode.postMessage({ type: 'loadMonth', year: year, month: month });

}());
</script>

</body>
</html>
