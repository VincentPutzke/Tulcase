name: Release VSIX

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: Release mode. Normal releases use the synced version; major releases bump manually.
        required: true
        default: none
        type: choice
        options:
          - none
          - major

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  build:
    name: Build
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build extension
        run: npm run compile

  release:
    name: Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Determine release version
        id: version
        shell: bash
        run: |
          if [ "${{ inputs.release_type }}" = "major" ]; then
            npm version major --no-git-tag-version
          fi

          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "asset=vscode-tulcase-$VERSION.vsix" >> "$GITHUB_OUTPUT"

      - name: Package VSIX
        run: npm run package

      - name: Commit release version
        if: ${{ inputs.release_type == 'major' }}
        run: |
          git add package.json package-lock.json
          git commit -m "[skip ci] chore: release v${{ steps.version.outputs.version }}"

      - name: Create release tag
        run: git tag -a "${{ steps.version.outputs.tag }}" -m "Release ${{ steps.version.outputs.tag }}"

      - name: Push release commit and tag
        if: ${{ inputs.release_type == 'major' }}
        run: |
          git push origin HEAD:main
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Push release tag
        if: ${{ inputs.release_type != 'major' }}
        run: git push origin "${{ steps.version.outputs.tag }}"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" "${{ steps.version.outputs.asset }}" \
            --title "${{ steps.version.outputs.tag }}" \
            --generate-notes